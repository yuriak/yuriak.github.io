    procedure.
  code_url: https://github.com/yuriak/GaussianThoughtSampler
  selected_order: 1
  tldr: A learnable, context-conditioned Gaussian sampler makes latent reasoning trajectories more useful
    at inference time, improving pass@N without updating the reasoning backbone.
  selected: true
  publication_order: 1
wang-etal-2026-towards-inference:
  id: towards
  thumbnail: /assets/publications/towards.png
  thumbnail_alt: Pass-at-N evaluation curves from the LatentITS research project.

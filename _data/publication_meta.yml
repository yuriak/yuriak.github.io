  selected_order: 2
  tldr: Investigates how test-time sampling and verification transfer from textual chain-of-thought to
    continuous latent reasoning, revealing the limitations of conventional rerankers.
  selected: true
  publication_order: 2
wang-etal-2025-discrete:
  id: discrete-minds
  thumbnail: /assets/publications/discrete-minds.png
  thumbnail_alt: Overview of experiments for measuring language model awareness of elapsed time.
  code_url: https://github.com/yuriak/LLMTimePerception
  selected_order: 3
  tldr: Tests whether language models perceive elapsed time, not just reason about dates, through dialogue
